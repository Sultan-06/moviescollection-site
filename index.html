<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame - Streaming Library</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
                    <span>Frame</span>
                </div>
                <ul class="nav-links">
                    <li class="active"><a href="#">Overview</a></li>
                    <li><a href="#">My Library</a></li>
                    <li><a href="#">Watchlist</a></li>
                    <li><a href="#">Collections</a></li>
                    <li><a href="#">Browse <i class="fa-solid fa-chevron-down text-sm"></i></a></li>
                </ul>
            </div>
            
            <div class="nav-right">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search your library">
                </div>
                <button class="add-title-btn">
                    <i class="fa-solid fa-plus"></i> Add title
                </button>
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/150?img=47" alt="Alex Morgan" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Alex Morgan</span>
                        <span class="user-plan">Curator plan</span>
                    </div>
                    <i class="fa-solid fa-ellipsis hover-icon"></i>
                </div>
            </div>
        </nav>
    </div>

    <div class="hero-section">
       <div class="movie-row">
        
        <!-- Advanced Netflix-Style Card -->
        <div class="movie-card">
            <!-- Background Image -->
            <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=600&q=80" alt="Movie Scene" class="card-img">
            
            <!-- Hover Content -->
            <div class="card-content">
                
                <!-- Action Buttons -->
                <div class="button-row">
                    <div class="left-buttons">
                        <button class="play-btn">
                            <!-- SVG Play Icon -->
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="circle-btn">+</button>
                        <button class="circle-btn">👍</button>
                    </div>
                    <div class="right-buttons">
                        <button class="circle-btn">⌄</button>
                    </div>
                </div>

                <!-- Movie Metadata -->
                <div class="metadata">
                    <span class="match">98% Match</span>
                    <span class="age-rating">TV-MA</span>
                    <span class="duration">2h 15m</span>
                    <span class="hd-badge">HD</span>
                </div>

                <!-- Genres -->
                <div class="genres">
                    <span>Gritty</span>
                    <span class="dot">•</span>
                    <span>Dark</span>
                    <span class="dot">•</span>
                    <span>Sci-Fi Thriller</span>
                </div>

            </div>
        </div>

    </div>
    </div>
</body>
