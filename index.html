<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame - Streaming Library</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-left">
                <div class="logo">
                    <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
                    <span>Frame</span>
                </div>
                <ul class="nav-links">
                    <li class="active"><a href="#">Overview</a></li>
                    <li><a href="#">My Library</a></li>
                    <li><a href="#">Watchlist</a></li>
                    <li><a href="#">Collections</a></li>
                    <li><a href="#">Browse <i class="fa-solid fa-chevron-down text-sm"></i></a></li>
                </ul>
            </div>
            
            <div class="nav-right">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search your library">
                </div>
                <button class="add-title-btn">
                    <i class="fa-solid fa-plus"></i> Add title
                </button>
                <div class="user-profile">
                    <img src="https://i.pravatar.cc/150?img=47" alt="Alex Morgan" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Alex Morgan</span>
                        <span class="user-plan">Curator plan</span>
                    </div>
                    <i class="fa-solid fa-ellipsis hover-icon"></i>
                </div>
            </div>
        </nav>
    </div>
</body>
